name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Run Black formatter check
      run: |
        black --check streamer/ airflow/dags/

    - name: Run Flake8 linter check
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 streamer/ airflow/dags/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 streamer/ airflow/dags/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
